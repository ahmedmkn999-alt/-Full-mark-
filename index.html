<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Full Mark</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --icy-green: #a8ffd2; --glow: #00ff88; --dark-bg: #05130d; --card-bg: rgba(255, 255, 255, 0.03); }
        body { margin: 0; background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; overflow-x: hidden; user-select: none; }
        
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .star { position: absolute; background: white; border-radius: 50%; box-shadow: 0 0 5px white; animation: floatUp linear infinite; }
        @keyframes floatUp { 0% { opacity: 0; transform: translateY(100px) scale(0.5); } 50% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(0.5); } }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: rgba(5, 19, 13, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(168, 255, 210, 0.2); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0, 255, 136, 0.1); }
        .brand { display: flex; flex-direction: column; }
        .brand h1 { color: var(--icy-green); text-shadow: 0 0 10px var(--glow); margin: 0; font-size: 1.8em; letter-spacing: 1px; }
        .brand span { color: #d1f2e0; font-size: 0.8em; opacity: 0.8; }
        
        .profile-trigger { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--icy-green); cursor: pointer; overflow: hidden; transition: 0.3s; box-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .profile-trigger:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--glow); }
        .profile-trigger img { width: 100%; height: 100%; object-fit: cover; }

        .profile-sidebar { position: fixed; top: 0; left: -350px; width: 300px; height: 100vh; background: rgba(5, 19, 13, 0.95); backdrop-filter: blur(20px); border-right: 1px solid rgba(168, 255, 210, 0.2); transition: 0.4s ease-in-out; z-index: 1000; padding: 30px; box-shadow: 5px 0 30px rgba(0,0,0,0.8); overflow-y: auto; }
        .profile-sidebar.open { left: 0; }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 1.5em; color: white; cursor: pointer; transition: 0.3s; }
        .close-btn:hover { color: #ff4d4d; transform: rotate(90deg); }
        .profile-header { text-align: center; margin-top: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .profile-header img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--glow); box-shadow: 0 0 20px rgba(0,255,136,0.4); }
        .profile-header h2 { color: var(--icy-green); margin: 15px 0 5px; font-size: 1.5em; }
        .profile-header p { color: #aaa; margin: 0; font-size: 0.9em; }
        .profile-stats { margin-top: 20px; display: grid; gap: 15px; }
        .stat-box { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid rgba(168,255,210,0.1); display: flex; align-items: center; justify-content: space-between; }
        .stat-box i { color: var(--glow); font-size: 1.5em; }

        .countdown-wrapper { margin-top: 25px; text-align: center; background: rgba(0, 255, 136, 0.05); padding: 15px; border-radius: 15px; border: 1px solid rgba(168,255,210,0.15); box-shadow: 0 0 15px rgba(0,255,136,0.05); }
        .countdown-title { color: #d1f2e0; font-size: 0.9em; margin-bottom: 15px; font-weight: bold; }
        .timer { display: flex; justify-content: center; gap: 8px; direction: ltr; }
        .time-box { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--icy-green); padding: 10px; border-radius: 10px; min-width: 45px; text-align: center; }
        .time-box span { display: block; font-size: 1.3em; font-weight: bold; color: white; text-shadow: 0 0 10px var(--glow); }
        .time-box label { font-size: 0.7em; color: var(--icy-green); display: block; margin-top: 3px; }

        .controls-bar { max-width: 1300px; margin: 20px auto 0; padding: 0 40px; display: flex; align-items: center; gap: 20px; }
        .back-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(168,255,210,0.3); color: var(--icy-green); padding: 10px 20px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: bold; transition: 0.3s; backdrop-filter: blur(5px); }
        .back-btn:hover { background: var(--glow); color: #05130d; transform: translateX(5px); }
        .breadcrumb { color: #aaa; font-size: 1.1em; display:flex; align-items:center; gap: 10px;}
        .breadcrumb span { color: white; font-weight: bold; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 30px 40px 60px; max-width: 1300px; margin: auto; }
        .card { background: var(--card-bg); backdrop-filter: blur(15px); border: 1px solid rgba(168, 255, 210, 0.15); border-radius: 20px; padding: 15px; text-align: center; transition: all 0.4s ease; cursor: pointer; position: relative; overflow: hidden;}
        .card:hover { transform: translateY(-8px); border-color: var(--icy-green); box-shadow: 0 10px 30px rgba(0, 255, 136, 0.15); }
        .card-icon { font-size: 3em; color: var(--icy-green); margin: 20px 0; text-shadow: 0 0 15px var(--glow); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .card h3 { color: var(--icy-green); font-size: 1.3em; margin: 5px 0; }
        .card p.sub { color: #d1f2e0; font-size: 0.9em; margin: 0; background: rgba(0,255,136,0.1); padding: 5px; border-radius: 5px;}

        .cinema-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .cinema-modal.active { opacity: 1; pointer-events: all; }
        .cinema-close { position: absolute; top: 30px; right: 40px; font-size: 2.5em; color: white; cursor: pointer; transition: 0.3s; }
        .cinema-close:hover { color: #ff4d4d; transform: scale(1.1); }
        .cinema-title { color: var(--icy-green); font-size: 1.8em; margin-bottom: 20px; text-shadow: 0 0 15px var(--glow); }
        .player-wrapper { width: 80%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border-radius: 20px; overflow: hidden; border: 2px solid var(--icy-green); box-shadow: 0 0 50px rgba(0, 255, 136, 0.3); }
        .player-wrapper video, .player-wrapper iframe { width: 100%; height: 100%; border: none; }
        
        .loading-container { text-align: center; margin-top: 50px; }
        .loading-text { color: var(--icy-green); font-size: 1.5em; text-shadow: 0 0 10px var(--glow); }
        .loading-sub { color: #aaa; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="stars-container" id="stars"></div>
    
    <nav>
        <div class="brand">
            <h1>Full Mark</h1>
            <span>طريقك للعلامة الكاملة</span>
        </div>
        <div class="profile-trigger" onclick="toggleProfile()">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&backgroundColor=a8ffd2" alt="Profile">
        </div>
    </nav>

    <div class="profile-sidebar" id="profileSidebar">
        <i class="fas fa-times close-btn" onclick="toggleProfile()"></i>
        <div class="profile-header">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&backgroundColor=a8ffd2" alt="Profile">
            <h2 id="userName">طالب Full Mark</h2>
            <p id="userEmail">يتم الربط قريباً...</p>
        </div>
        <div class="profile-stats">
            <div class="stat-box">
                <div>
                    <div style="color:#aaa; font-size:0.8em">المستوى الحالي</div>
                    <div style="color:white; font-size:1.1em; font-weight:bold">الأسطورة 👑</div>
                </div>
                <i class="fas fa-trophy"></i>
            </div>
        </div>
        <div class="countdown-wrapper">
            <div class="countdown-title">الوقت المتبقي على التفوق 🚀</div>
            <div class="timer">
                <div class="time-box"><span id="days">00</span><label>أيام</label></div>
                <div class="time-box"><span id="hours">00</span><label>ساعات</label></div>
                <div class="time-box"><span id="mins">00</span><label>دقائق</label></div>
                <div class="time-box"><span id="secs">00</span><label>ثواني</label></div>
            </div>
        </div>
    </div>

    <div class="controls-bar" id="controls-bar"></div>
    <div id="main-content">
        <div class="loading-container" id="loadingBox">
            <div class="loading-text"><i class="fas fa-spinner fa-spin"></i> جاري سحب البيانات... ⏳</div>
            <div class="loading-sub" id="loadingSub">نبحث عن أفضل مسار آمن لسحب المحتوى...</div>
        </div>
    </div>

    <div class="cinema-modal" id="cinemaModal">
        <i class="fas fa-times cinema-close" onclick="closePlayer()"></i>
        <h2 class="cinema-title" id="cinemaTitle">المحاضرة</h2>
        <div class="player-wrapper" id="playerWrapper"></div>
    </div>

    <script>
        // 1. النجوم
        const starsContainer = document.getElementById('stars');
        for(let i=0; i<80; i++) {
            let star = document.createElement('div'); star.className = 'star';
            let size = Math.random() * 3 + 1; star.style.width = size + 'px'; star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + 'vw'; star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 4 + 3) + 's'; star.style.animationDelay = (Math.random() * 5) + 's';
            starsContainer.appendChild(star);
        }

        function toggleProfile() { document.getElementById('profileSidebar').classList.toggle('open'); }

        // 2. العداد
        const countDownDate = new Date("Jun 1, 2026 00:00:00").getTime();
        setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;
            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById("mins").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById("secs").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }, 1000);

        const levelNames = ["السنة الدراسية", "المواد", "المدرسين", "الكورسات", "المحاضرات", "تقسيم المحاضرة", "الفيديوهات"];
        const levelActions = ["اضغط لفتح المواد", "اضغط لفتح المدرسين", "اضغط لفتح الكورسات", "اضغط لفتح المحاضرات", "اضغط لفتح الأقسام", "اضغط لفتح الفيديوهات", "شاهد المحاضرة الآن"];
        const levelIcons = ["fa-calendar-alt", "fa-book", "fa-chalkboard-teacher", "fa-layer-group", "fa-chalkboard", "fa-list-ol", "fa-play-circle"];

        const mainContent = document.getElementById('main-content');
        const controlsBar = document.getElementById('controls-bar');
        const loadingSub = document.getElementById('loadingSub');
        let historyStack = [];

        // 3. كود السحب الذكي (بيجرب 4 طرق مختلفة عشان يضمن نجاح السحب)
        const targetUrl = 'https://thanwyaplus.vercel.app/organized_output.json';
        const proxyList = [
            targetUrl, // محاولة مباشرة
            \`/api/data\`, // محاولة عبر Vercel Rewrite
            \`https://corsproxy.io/?\${encodeURIComponent(targetUrl)}\`, // كوبري 1
            \`https://api.allorigins.win/raw?url=\${encodeURIComponent(targetUrl)}\`, // كوبري 2
            \`https://api.codetabs.com/v1/proxy?quest=\${targetUrl}\` // كوبري 3
        ];

        async function fetchWithFallback(proxies) {
            for (let i = 0; i < proxies.length; i++) {
                try {
                    loadingSub.innerText = \`محاولة الاتصال بالمسار (\${i + 1}/\${proxies.length})...\`;
                    let res = await fetch(proxies[i]);
                    if (res.ok) {
                        return await res.json();
                    }
                } catch (e) {
                    console.warn("فشل المسار: ", proxies[i]);
                }
            }
            throw new Error("فشلت جميع طرق الاتصال");
        }

        // تشغيل السحب الذكي
        fetchWithFallback(proxyList)
            .then(data => { renderView(data, 0, "الرئيسية"); })
            .catch(err => { 
                mainContent.innerHTML = '<h3 style="text-align:center; color:#ff4d4d;">حدث خطأ في الاتصال بالخادم.. تأكد من قوة الإنترنت وقم بتحديث الصفحة.</h3>'; 
                console.error(err);
            });

        // 4. دالة العرض وبناء المنصة
        function renderView(dataObject, currentDepth, currentTitle) {
            mainContent.innerHTML = ''; 
            controlsBar.innerHTML = '';

            if (historyStack.length > 0) {
                const backBtn = document.createElement('button');
                backBtn.className = 'back-btn';
                backBtn.innerHTML = '<i class="fas fa-arrow-right"></i> رجوع';
                backBtn.onclick = () => {
                    const prev = historyStack.pop();
                    renderView(prev.data, prev.depth, prev.title);
                };
                controlsBar.appendChild(backBtn);
                
                const breadcrumb = document.createElement('div');
                breadcrumb.className = 'breadcrumb';
                breadcrumb.innerHTML = \`<i class="fas fa-folder-open"></i> <span>\${currentTitle}</span>\`;
                controlsBar.appendChild(breadcrumb);
            }

            const grid = document.createElement('div');
            grid.className = 'grid-container';
            mainContent.appendChild(grid);

            let items = [];
            if (Array.isArray(dataObject)) {
                items = dataObject.map((val, idx) => ({ key: val.title || val.name || \`عنصر \${idx+1}\`, value: val }));
            } else if (typeof dataObject === 'object' && dataObject !== null) {
                Object.keys(dataObject).forEach(key => {
                    if(key !== 'image_url' && key !== 'image' && key !== 'title' && key !== 'video_url') {
                        items.push({ key: key, value: dataObject[key] });
                    }
                });
            }

            if (items.length === 0) {
                grid.innerHTML = '<h3 style="color:white; width:100%; text-align:center;">لا يوجد محتوى هنا!</h3>';
                return;
            }

            let safeDepth = currentDepth > 6 ? 6 : currentDepth;

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let isVideo = false;
                let videoUrl = null;
                
                if (typeof item.value === 'string' && (item.value.includes('http') || item.value.includes('mp4'))) {
                    isVideo = true; videoUrl = item.value;
                } else if (item.value && (item.value.video_url || item.value.link)) {
                    isVideo = true; videoUrl = item.value.video_url || item.value.link;
                } else if (safeDepth === 6) { 
                    isVideo = true; videoUrl = item.value; 
                }

                let titleText = item.key;
                let actionText = levelActions[safeDepth] || "اضغط للفتح";
                let iconClass = levelIcons[safeDepth] || "fa-folder";
                let img = (item.value && (item.value.image_url || item.value.image)) ? item.value.image_url || item.value.image : null;

                if (isVideo) {
                    card.innerHTML = \`
                        \${img ? \`<img src="\${img}">\` : \`<div class="card-icon"><i class="fas fa-play-circle"></i></div>\`}
                        <h3>\${titleText}</h3>
                        <p class="sub" style="background: rgba(0, 255, 136, 0.2); color: white;"><i class="fas fa-film"></i> تشغيل السينما</p>
                    \`;
                    card.onclick = () => openPlayer(videoUrl, titleText);
                } else {
                    card.innerHTML = \`
                        \${img ? \`<img src="\${img}">\` : \`<div class="card-icon"><i class="fas \${iconClass}"></i></div>\`}
                        <h3>\${titleText}</h3>
                        <p class="sub"><i class="fas fa-mouse-pointer"></i> \${actionText}</p>
                    \`;
                    card.onclick = () => {
                        historyStack.push({ data: dataObject, depth: currentDepth, title: currentTitle }); 
                        renderView(item.value, currentDepth + 1, titleText);   
                    };
                }
                
                grid.appendChild(card);
            });
        }

        function openPlayer(url, title) {
            const modal = document.getElementById('cinemaModal');
            const wrapper = document.getElementById('playerWrapper');
            document.getElementById('cinemaTitle').innerText = title;
            wrapper.innerHTML = ''; 
            
            if (typeof url === 'object') url = url.video_url || url.link || Object.values(url)[0]; 
            
            if (url && (url.includes('youtube') || url.includes('iframe'))) {
                wrapper.innerHTML = \`<iframe src="\${url}" allowfullscreen allow="autoplay; encrypted-media"></iframe>\`;
            } else if (url) {
                wrapper.innerHTML = \`<video controls autoplay controlsList="nodownload"><source src="\${url}"></video>\`;
            } else {
                wrapper.innerHTML = \`<h3 style="color:white; margin-top: 20%; text-align:center;">رابط الفيديو غير صالح</h3>\`;
            }
            modal.classList.add('active');
        }

        function closePlayer() {
            const modal = document.getElementById('cinemaModal');
            const wrapper = document.getElementById('playerWrapper');
            modal.classList.remove('active');
            wrapper.innerHTML = ''; 
        }

        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
            if(e.keyCode == 27) closePlayer();
        }
    </script>
</body>
</html>
